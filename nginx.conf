# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user carte;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        server_name  digital-carte.com;
        root         /home/carte/www;
        index index.html;
#       include /etc/nginx/default.d/*.conf;
	return 301 https://$host$request_uri;
#       location / {
#       }
    }
    
    server {
	listen		80;
	server_name	dev.digital-carte.com;
	root		/home/carte/www/dev;
	index	index.html;
#	include		/etc/nginx/default.d/*/conf;
	return 301 https://$host$request_uri;
#	location / {
#	}	
    }

# Settings for a TLS enabled server.

    server {
        listen       443 ssl;
        server_name  digital-carte.com;
        root         /home/carte/www;

        ssl_certificate "/etc/nginx/ssl/digital-carte.fullchain.crt";
        ssl_certificate_key "/etc/nginx/ssl/digital-carte.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        location / {
    	    try_files $uri $uri/ /index.html;
        }
        
	location /api {
    	    proxy_pass https://localhost:8800;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Client-IP $remote_addr;
        }
        
        location /static {
    	    proxy_pass https://localhost:8800;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Client-IP $remote_addr;
        }


    }
    
    server {
        listen       443 ssl;
        server_name  dev.digital-carte.com;
        root         /home/carte/www/dev;

        ssl_certificate "/etc/nginx/ssl/dev/dev.digital-carte.bundle.crt";
        ssl_certificate_key "/etc/nginx/ssl/dev/dev.digital-carte.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;
        
	location / {
	    try_files $uri $uri/ /index.html;
	}

        location /api {
    	    proxy_pass https://localhost:8806/api;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Client-IP $remote_addr;
        }

	location /static {
	    proxy_pass https://localhost:8806/static;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Client-IP $remote_addr;
	}
    }
    

}

